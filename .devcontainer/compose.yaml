services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev          # 開発用ステージを指定
    volumes:
      - ../:/workspace:cached
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: poetry run uvicorn src.api.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      DB_HOST: db
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: devdb

  db:
    image: postgres:17.2-bookworm
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=devdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
