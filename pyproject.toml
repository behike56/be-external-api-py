[tool.poetry]
name = "be-external-api-py"
version = "0.1.0"
description = ""
authors = ["behike56 <engineering@lambda-publishing.dev>"]
readme = "README.md"
packages = [{ include = "api", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13.1"
sqlalchemy = "^2.0.36"
requests = "^2.32.3"
pyyaml = "^6.0.2"
alembic = "^1.14.0"
fastapi = "^0.115.6"
uvicorn = "^0.32.1"
psycopg2 = "^2.9.10"
asyncpg = "^0.30.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.2"
alembic = "^1.14.0"
pytest-asyncio = "^0.25.0"
aiosqlite = "^0.20.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",    # undocumented
    "D203",  # one blank line before class
    "D213",  # multi-line summary second line
    "TD001", # invalid todo tag
    "TD002", # missing todo author
    "TD003", # missing todo link
    "PD011", # pandas use of dot values
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

logger-objects = ["src.library.logger.LOGGER"]

[tool.ruff.lint.pylint]
max-args = 6